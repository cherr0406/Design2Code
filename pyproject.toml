[project]
name = "design2code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.7.0",
    "bitsandbytes>=0.45.5 ; sys_platform == 'linux' or sys_platform == 'windows'",
    "clip",
    "colormath>=3.0.0",
    "deepspeed>=0.16.9",
    "en-core-web-sm",
    "joblib>=1.5.1",
    "jsonlines>=4.0.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
    "opencv-python>=4.11.0.86",
    "pillow>=11.2.1",
    "pydantic>=2.11.5",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "spacy>=3.8.7",
    "streamlit>=1.45.1",
    "swissarmytransformer>=0.4.12",
    "timm>=1.0.15",
    "torch>=2.6.0, <2.7.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
    "transformers>=4.52.3",
    "wandb>=0.19.11",
    "xformers>=0.0.29.post3 ; sys_platform == 'linux' or sys_platform == 'windows'",
]

[dependency-groups]
dev = [
    "setuptools>=80.1.0",
    "types-seaborn>=0.13.2.20250516",
    "types-tqdm>=4.67.0.20250417",
]

[tool.uv]
no-build-isolation-package = ["xformers"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
Design2Code = ["py.typed"]

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
